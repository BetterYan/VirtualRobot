# vrobot 2D SLAM 配置（对应 protocols/message-schema v1.0）

server:
  host: "127.0.0.1"
  port: 9094

sensor:            # 与 Godot hello 消息对齐；以 hello 为准，此处是兜底默认
  lidar_beams: 144
  angle_min: -3.14159265
  range_max: 320.0

grid:
  cell_size: 8.0        # px / 格
  width: 200            # 格数（1600px）
  height: 160           # 格数（1280px）
  l_hit: 0.9            # 命中格 log-odds 增量
  l_miss: -0.35         # 途经空闲格 log-odds 增量
  l_min: -4.0           # clamp 上下限
  l_max: 4.0

scan_match:
  search_xy: 24.0       # 粗搜索半窗 px
  search_th: 0.20       # 粗搜索半窗 rad
  coarse_step_xy: 4.0
  coarse_step_th: 0.05
  min_score: 0.30       # 命中点平均概率低于此值则不采纳匹配结果

slam:
  use_match: true       # false = 纯里程计（对照基线）

explorer:
  mode: hybrid           # hybrid=沿边→弓形→frontier | frontier=纯frontier | reactive=反应式避障(调试) | off
  enabled: true           # 自动驾驶默认开启（Godot HUD 按钮可切 manual 遥控）
  linear: 60.0
  angular: 1.5
  inflate_cells: 2        # A* 障碍膨胀格数（≈机器人半径 14px / 8px 格）
  min_frontier_size: 4    # 忽略过小的未知碎片
  hybrid:                 # hybrid 模式参数（沿边→弓形→frontier 三阶段）
    lane_pitch: 4         # 弓形车道行距（格，4格=32px）
    min_run: 4            # 车道最小长度（格）
  reactive:               # reactive 模式参数
    linear: 55.0
    angular: 1.6
    front_dist: 60.0
    beam_spread: 7

eval:
  enabled: true         # 消费 ground_truth 计算位姿误差（不影响算法）
