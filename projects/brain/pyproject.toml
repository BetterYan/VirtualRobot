[project]
name = "vrobot-brain"
version = "0.1.0"
description = "VirtualRobot 算法端：2D SLAM 建图定位（无图仿真验证）"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "websockets>=11.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
